  <style>
    /* Critical boot styles — prevent the white flash before Angular loads */
    html { background: #f7f8fd; }
    body { margin: 0; background: #f7f8fd; }
    .boot-screen {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #f7f8fd;
    }
    .boot-mark {
      width: 52px; height: 52px; border-radius: 14px;
      display: grid; place-items: center;
      background: linear-gradient(100deg, #4f6bf5, #8b5cf6, #22c7e6);
      color: #fff; font: 800 18px/1 Inter, system-ui, sans-serif;
      box-shadow: 0 10px 34px -8px rgba(84, 87, 240, 0.5);
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.94); opacity: 0.75; }
    }
    @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot-screen" aria-label="Loading">

    </div>
  </app-root>
